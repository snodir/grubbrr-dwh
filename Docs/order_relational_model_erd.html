<style>
#erd svg { width: 100%; height: auto; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd" style="padding: 1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
  },
});
const diagram = `erDiagram
  orders {
    text order_id PK
    text kiosk_session_id
    timestamp order_date
    date business_date
    text location_id
    text order_type_label
    int channel
    bool is_test_order
    bool is_failed_to_send_to_pos
    int pos_submission_status
    int guest_count
    int totals_sub_total_cents
    int totals_tax_cents
    int totals_tip_cents
    int totals_total_cents
    int totals_discount_cents
    text order_token
    text customer_name
    text customer_phone
    text customer_email
    text kiosk_id
    text kiosk_name
    int kiosk_mode
    text source_file
    timestamp ingest_ts
  }
  order_items {
    text order_item_id PK
    text order_id FK
    text category_id
    text category_name
    text menu_item_id
    text item_name
    int unit_price_cents
    int total_price_cents
    int quantity
    text special_request
    text item_session_id
    bool is_scanned
    text discount_id
    text source_file
  }
  order_item_modifiers {
    bigserial id PK
    text order_item_id FK
    text order_id FK
    text modifier_group_id
    text modifier_group_name
    text modifier_id
    text modifier_name
    int quantity
    int unit_price_cents
    int total_price_cents
    bool is_default
    bool is_invisible
    text source_file
  }
  order_payments {
    bigserial id PK
    text order_id FK
    int amount_cents
    text payment_method
    text payment_integration_id
    text payment_integration_label
    text transaction_id
    text payment_card_name
    text payment_card_number_masked
    bool is_amazon_one_payment
    text status
    text source_file
  }
  orders ||--o{ order_items : contains
  orders ||--o{ order_payments : paid_by
  order_items ||--o{ order_item_modifiers : has
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
